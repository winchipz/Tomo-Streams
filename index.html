<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tomo Stream</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e0e10;
    --surface:   #18181b;
    --surface2:  #1f1f23;
    --border:    #2a2a2e;
    --purple:    #9147ff;
    --purple2:   #772ce8;
    --text:      #efeff1;
    --muted:     #adadb8;
    --live:      #eb0400;
    --radius:    10px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 16px;
    color: var(--purple);
    text-decoration: none;
  }

  .logo svg { width: 22px; height: 22px; fill: var(--purple); }

  .search-bar {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    gap: 8px;
  }

  .search-bar input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    width: 100%;
  }

  .search-bar input::placeholder { color: var(--muted); }

  .viewers-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .viewers-badge .dot {
    width: 8px; height: 8px;
    background: #00c853;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── MAIN LAYOUT ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .tab-btn.active {
    color: var(--purple);
    border-bottom-color: var(--purple);
  }

  .tab-content { display: none; flex: 1; overflow-y: auto; }
  .tab-content.active { display: block; }

  /* scrollbar */
  .tab-content::-webkit-scrollbar { width: 4px; }
  .tab-content::-webkit-scrollbar-track { background: transparent; }
  .tab-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── STREAM CARDS ── */
  .stream-card {
    display: flex;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid var(--border);
  }

  .stream-card:hover { background: var(--surface2); }
  .stream-card.active { background: var(--surface2); border-left: 3px solid var(--purple); }

  .stream-thumb {
    position: relative;
    width: 80px;
    height: 45px;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--surface2);
  }

  .stream-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .live-badge {
    position: absolute;
    bottom: 3px;
    left: 3px;
    background: var(--live);
    color: white;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
    letter-spacing: 0.5px;
  }

  .viewer-count {
    position: absolute;
    bottom: 3px;
    right: 3px;
    background: rgba(0,0,0,0.7);
    color: white;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
  }

  .stream-info { flex: 1; min-width: 0; }

  .stream-name {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .stream-game {
    font-size: 11px;
    color: var(--purple);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stream-title {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── GAME CARDS ── */
  .game-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid var(--border);
  }

  .game-card:hover { background: var(--surface2); }

  .game-card img {
    width: 36px;
    height: 48px;
    border-radius: 4px;
    object-fit: cover;
    background: var(--surface2);
  }

  .game-card-name { font-size: 13px; font-weight: 500; }

  /* ── PLAYER AREA ── */
  .player-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #000;
  }

  .player-container {
    flex: 1;
    position: relative;
    background: #000;
  }

  #twitch-embed {
    width: 100%;
    height: 100%;
    border: none;
  }

  .player-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--muted);
  }

  .player-placeholder svg { width: 64px; height: 64px; fill: var(--border); }
  .player-placeholder h2 { font-size: 20px; color: var(--text); }
  .player-placeholder p { font-size: 14px; }

  /* ── REACTIONS ── */
  .reactions-bar {
    display: flex;
    gap: 8px;
    padding: 8px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .reaction-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .reaction-btn:hover {
    background: var(--purple);
    border-color: var(--purple);
    transform: scale(1.1);
  }

  /* ── FLOATING REACTIONS ── */
  .floating-reaction {
    position: fixed;
    font-size: 28px;
    pointer-events: none;
    animation: floatUp 2.5s ease-out forwards;
    z-index: 999;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-200px) scale(1.4); opacity: 0; }
  }

  /* ── LOADING ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--muted);
    font-size: 13px;
    gap: 10px;
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── NOW WATCHING BAR ── */
  .now-watching {
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .now-watching .live-dot {
    width: 8px; height: 8px;
    background: var(--live);
    border-radius: 50%;
    flex-shrink: 0;
    animation: pulse 1.5s infinite;
  }

  .now-watching-text { font-size: 12px; color: var(--muted); }
  .now-watching-name { font-size: 13px; font-weight: 600; color: var(--text); }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .sidebar { width: 200px; }
    .stream-thumb { width: 60px; height: 34px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M11.64 5.93h1.43v4.28h-1.43m3.93-4.28H17v4.28h-1.43M7 2L3.43 5.57v12.86h4.28V22l3.58-3.57h2.85L20.57 12V2m-1.43 9.29-2.85 2.85h-2.86l-2.5 2.5v-2.5H7.71V3.43h11.43z"/></svg>
    Tomo Stream
  </div>
  <div class="search-bar">
    <svg width="14" height="14" fill="var(--muted)" viewBox="0 0 24 24"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/></svg>
    <input type="text" id="search-input" placeholder="Search streams..." />
  </div>
  <div class="viewers-badge">
    <div class="dot"></div>
    <span id="viewer-count">0 watching</span>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-tabs">
      <button class="tab-btn active" onclick="switchTab('streams')">Live</button>
      <button class="tab-btn" onclick="switchTab('games')">Games</button>
    </div>
    <div class="tab-content active" id="tab-streams">
      <div class="loading" id="streams-loading">
        <div class="spinner"></div> Loading streams...
      </div>
      <div id="streams-list"></div>
    </div>
    <div class="tab-content" id="tab-games">
      <div class="loading" id="games-loading">
        <div class="spinner"></div> Loading games...
      </div>
      <div id="games-list"></div>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="player-area">
    <div class="now-watching" id="now-watching" style="display:none">
      <div class="live-dot"></div>
      <div>
        <div class="now-watching-text">Now watching together</div>
        <div class="now-watching-name" id="now-watching-name"></div>
      </div>
    </div>

    <div class="player-container">
      <div class="player-placeholder" id="player-placeholder">
        <svg viewBox="0 0 24 24"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
        <h2>Pick a stream</h2>
        <p>Select a live stream from the sidebar to watch together</p>
      </div>
      <iframe id="twitch-embed" style="display:none" allowfullscreen></iframe>
    </div>

    <!-- REACTIONS -->
    <div class="reactions-bar">
      <span style="font-size:12px;color:var(--muted);align-self:center;margin-right:4px">React:</span>
      <button class="reaction-btn" onclick="sendReaction('🔥')">🔥</button>
      <button class="reaction-btn" onclick="sendReaction('😂')">😂</button>
      <button class="reaction-btn" onclick="sendReaction('😮')">😮</button>
      <button class="reaction-btn" onclick="sendReaction('❤️')">❤️</button>
      <button class="reaction-btn" onclick="sendReaction('👏')">👏</button>
      <button class="reaction-btn" onclick="sendReaction('💜')">💜</button>
    </div>
  </div>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────
  const BASE_URL = window.location.origin;
  const WS_URL = BASE_URL.replace('https://', 'wss://').replace('http://', 'ws://');
  const TWITCH_CLIENT_ID = 'v7w0wlmm9cb2y1zcfo50ys0z4mhzgx';

  // Room ID — in Discord Activity this would come from the voice channel ID
  // For now we use URL param or default
  const urlParams = new URLSearchParams(window.location.search);
  const ROOM_ID = urlParams.get('room') || 'default';

  let currentChannel = null;
  let ws = null;
  let viewerCount = 0;

  // ── WEBSOCKET ────────────────────────────────────────────────
  function connectWS() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'join', roomId: ROOM_ID }));
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      if (msg.type === 'joined' || msg.type === 'user_joined' || msg.type === 'user_left') {
        viewerCount = msg.count;
        document.getElementById('viewer-count').textContent = `${viewerCount} watching`;
      }

      if (msg.type === 'stream_change') {
        loadStream(msg.channel, false);
      }

      if (msg.type === 'reaction') {
        showFloatingReaction(msg.emoji);
      }
    };

    ws.onclose = () => {
      setTimeout(connectWS, 3000); // auto-reconnect
    };
  }

  // ── LOAD STREAM ──────────────────────────────────────────────
  function loadStream(channel, broadcast = true) {
    currentChannel = channel;

    // Update iframe
    const embed = document.getElementById('twitch-embed');
    const placeholder = document.getElementById('player-placeholder');
    const domain = window.location.hostname || 'localhost';

    embed.src = `https://player.twitch.tv/?channel=${channel}&parent=${domain}&autoplay=true&muted=false`;
    embed.style.display = 'block';
    placeholder.style.display = 'none';

    // Now watching bar
    document.getElementById('now-watching').style.display = 'flex';
    document.getElementById('now-watching-name').textContent = channel;

    // Update active card
    document.querySelectorAll('.stream-card').forEach(c => {
      c.classList.toggle('active', c.dataset.channel === channel);
    });

    // Broadcast to room
    if (broadcast && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'change_stream', channel }));
    }
  }

  // ── REACTIONS ────────────────────────────────────────────────
  function sendReaction(emoji) {
    showFloatingReaction(emoji);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'reaction', emoji }));
    }
  }

  function showFloatingReaction(emoji) {
    const el = document.createElement('div');
    el.className = 'floating-reaction';
    el.textContent = emoji;
    el.style.left = (Math.random() * 60 + 20) + '%';
    el.style.bottom = '80px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }

  // ── TABS ─────────────────────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'streams') || (i === 1 && tab === 'games'));
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');

    if (tab === 'games' && document.getElementById('games-list').children.length === 0) {
      loadGames();
    }
  }

  // ── LOAD STREAMS ─────────────────────────────────────────────
  async function loadStreams(gameId = null) {
    const list = document.getElementById('streams-list');
    const loading = document.getElementById('streams-loading');
    loading.style.display = 'flex';
    list.innerHTML = '';

    try {
      const url = gameId
        ? `${BASE_URL}/api/streams?first=30&game_id=${gameId}`
        : `${BASE_URL}/api/streams?first=30`;
      const res = await fetch(url);
      const data = await res.json();
      loading.style.display = 'none';

      data.data.forEach(stream => {
        const thumb = stream.thumbnail_url
          .replace('{width}', '80').replace('{height}', '45');
        const viewers = stream.viewer_count >= 1000
          ? (stream.viewer_count / 1000).toFixed(1) + 'K'
          : stream.viewer_count;

        const card = document.createElement('div');
        card.className = 'stream-card';
        card.dataset.channel = stream.user_login;
        card.innerHTML = `
          <div class="stream-thumb">
            <img src="${thumb}" alt="" loading="lazy" onerror="this.src=''"/>
            <span class="live-badge">LIVE</span>
            <span class="viewer-count">${viewers}</span>
          </div>
          <div class="stream-info">
            <div class="stream-name">${stream.user_name}</div>
            <div class="stream-game">${stream.game_name || ''}</div>
            <div class="stream-title">${stream.title}</div>
          </div>
        `;
        card.onclick = () => loadStream(stream.user_login);
        if (stream.user_login === currentChannel) card.classList.add('active');
        list.appendChild(card);
      });
    } catch (err) {
      loading.innerHTML = 'Failed to load streams. Retrying...';
      setTimeout(() => loadStreams(gameId), 3000);
    }
  }

  // ── LOAD GAMES ───────────────────────────────────────────────
  async function loadGames() {
    const list = document.getElementById('games-list');
    const loading = document.getElementById('games-loading');
    loading.style.display = 'flex';

    try {
      const res = await fetch(`${BASE_URL}/api/games`);
      const data = await res.json();
      loading.style.display = 'none';

      data.data.forEach(game => {
        const imgUrl = game.box_art_url
          .replace('{width}', '36').replace('{height}', '48');
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${imgUrl}" alt="" loading="lazy" onerror="this.style.display='none'"/>
          <span class="game-card-name">${game.name}</span>
        `;
        card.onclick = () => {
          switchTab('streams');
          loadStreams(game.id);
        };
        list.appendChild(card);
      });
    } catch (err) {
      loading.innerHTML = 'Failed to load games.';
    }
  }

  // ── SEARCH ───────────────────────────────────────────────────
  let searchTimeout;
  document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const q = e.target.value.trim();
    if (!q) { loadStreams(); return; }
    searchTimeout = setTimeout(async () => {
      const list = document.getElementById('streams-list');
      const loading = document.getElementById('streams-loading');
      loading.style.display = 'flex';
      list.innerHTML = '';
      try {
        const res = await fetch(`${BASE_URL}/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        loading.style.display = 'none';
        data.data.forEach(ch => {
          const card = document.createElement('div');
          card.className = 'stream-card';
          card.dataset.channel = ch.broadcaster_login;
          card.innerHTML = `
            <div class="stream-thumb">
              <img src="${ch.thumbnail_url || ''}" alt="" loading="lazy"/>
              <span class="live-badge">LIVE</span>
            </div>
            <div class="stream-info">
              <div class="stream-name">${ch.display_name}</div>
              <div class="stream-game">${ch.game_name || ''}</div>
              <div class="stream-title">${ch.title || ''}</div>
            </div>
          `;
          card.onclick = () => loadStream(ch.broadcaster_login);
          list.appendChild(card);
        });
        if (data.data.length === 0) {
          list.innerHTML = '<div class="loading">No live streams found</div>';
        }
      } catch (err) {
        loading.innerHTML = 'Search failed.';
      }
    }, 400);
  });

  // ── INIT ─────────────────────────────────────────────────────
  connectWS();
  loadStreams();
</script>
</body>
</html>
